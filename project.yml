name: Volu
options:
  bundleIdPrefix: fi.volu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig

# Skeema on nyt nimenomainen, koska ajon on ladattava StoreKit-konfiguraatio:
# ilman sitä tilaustuotteita ei ole olemassa simulaattorissa eikä ostopolkua
# pysty testaamaan ennen App Store Connectin tuotteita.
schemes:
  Volu:
    build:
      targets:
        Volu: all
        VoluTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/Volu.storekit
    test:
      config: Debug
      targets:
        - VoluTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  VoluTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Volu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  Volu:
    type: application
    platform: iOS
    sources:
      - Volu
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.volu.app
        # Tiimi tähän eikä Xcodeen: projekti generoidaan uudelleen xcodegenillä,
        # joten käsin valittu tiimi katoaisi joka kerta ja laitekäännös kaatuisi
        # allekirjoitukseen aina uudelleen.
        DEVELOPMENT_TEAM: 4498TZK9KC
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Dev-vaihe: API-kutsut http://localhost:3000 vaativat ATS-poikkeuksen.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
    entitlements:
      path: Volu/Volu.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Kehitysarvo lähdetiedostossa; Xcode vaihtaa sen tuotannoksi
        # jakelukäännöksessä (TestFlight ja App Store käyttävät molemmat
        # tuotanto-APNs:ää). Sovellus ei luota tähän arvoon vaan lukee
        # lopullisen profiilinsa — ks. PushManager.environment.
        aps-environment: development
        com.apple.developer.applesignin: [Default]
    info:
      path: Volu/Info.plist
      properties:
        NSHealthShareUsageDescription: Apple Healthin tietoja luetaan, jotta askeleesi, unesi, painosi ja muissa sovelluksissa tehdyt suorituksesi näkyvät Volussa ilman käsin kirjaamista.
        NSCameraUsageDescription: Kameraa käytetään aterian kuvaamiseen, jotta AI voi arvioida ruoan ja sen makrot.
        NSPhotoLibraryUsageDescription: Kuvakirjastoa käytetään, kun valitset valmiin kuvan aterian arviointiin.
        SupabaseURL: $(VOLU_SUPABASE_URL)
        SupabaseAnonKey: $(VOLU_SUPABASE_ANON_KEY)
        APIBaseURL: $(VOLU_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Google-kirjautuminen avaa selaimen, ja paluu sovellukseen tapahtuu
        # tällä skeemalla. Ilman sitä vuo jää selaimeen eikä istuntoa synny.
        # Sama osoite on lisättävä Supabasen sallittuihin uudelleenohjauksiin.
        CFBundleURLTypes:
          - CFBundleURLName: fi.volu.app
            CFBundleURLSchemes: [fi.volu.app]
