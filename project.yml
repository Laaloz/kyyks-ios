name: Kyyks
options:
  bundleIdPrefix: fit.rooki
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig

# Skeema on nyt nimenomainen, koska ajon on ladattava StoreKit-konfiguraatio:
# ilman sitä tilaustuotteita ei ole olemassa simulaattorissa eikä ostopolkua
# pysty testaamaan ennen App Store Connectin tuotteita.
schemes:
  Kyyks:
    build:
      targets:
        Kyyks: all
        KyyksTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/Kyyks.storekit
    test:
      config: Debug
      targets:
        - KyyksTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  KyyksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Kyyks
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  Kyyks:
    type: application
    platform: iOS
    sources:
      - Kyyks
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fit.rooki.kyyks
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Dev-vaihe: API-kutsut http://localhost:3000 vaativat ATS-poikkeuksen.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
    entitlements:
      path: Kyyks/Kyyks.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Kyyks/Info.plist
      properties:
        NSHealthShareUsageDescription: Apple Healthin tietoja luetaan, jotta askeleesi, unesi ja muissa sovelluksissa tehdyt suorituksesi näkyvät Kyyksissä ilman käsin kirjaamista.
        NSCameraUsageDescription: Kameraa käytetään aterian kuvaamiseen, jotta AI voi arvioida ruoan ja sen makrot.
        NSPhotoLibraryUsageDescription: Kuvakirjastoa käytetään, kun valitset valmiin kuvan aterian arviointiin.
        SupabaseURL: $(KYYKS_SUPABASE_URL)
        SupabaseAnonKey: $(KYYKS_SUPABASE_ANON_KEY)
        APIBaseURL: $(KYYKS_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
