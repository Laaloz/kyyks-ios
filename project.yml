name: Volu
options:
  bundleIdPrefix: fi.volu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig

# Skeema on nyt nimenomainen, koska ajon on ladattava StoreKit-konfiguraatio:
# ilman sitä tilaustuotteita ei ole olemassa simulaattorissa eikä ostopolkua
# pysty testaamaan ennen App Store Connectin tuotteita.
schemes:
  Volu:
    build:
      targets:
        Volu: all
        VoluTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/Volu.storekit
    test:
      config: Debug
      targets:
        - VoluTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  VoluTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Volu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  Volu:
    type: application
    platform: iOS
    sources:
      - Volu
      # Live Activityn tietomalli käännetään molempiin kohteisiin, jottei
      # rakenne voi erota sovelluksen ja laajennoksen välillä.
      - Shared
    dependencies:
      - package: Supabase
        product: Supabase
      - target: VoluWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.volu.app
        # Tiimi tähän eikä Xcodeen: projekti generoidaan uudelleen xcodegenillä,
        # joten käsin valittu tiimi katoaisi joka kerta ja laitekäännös kaatuisi
        # allekirjoitukseen aina uudelleen.
        DEVELOPMENT_TEAM: 4498TZK9KC
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ilman tätä AccentColor-resurssi jää käyttämättä ja SwiftUI piirtää
        # järjestelmän sinisellä. Xcoden oma projektipohja asettaa arvon, mutta
        # projekti generoidaan xcodegenillä — eli se on asetettava täällä.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Dev-vaihe: API-kutsut http://localhost:3000 vaativat ATS-poikkeuksen.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
    entitlements:
      path: Volu/Volu.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Kehitysarvo lähdetiedostossa; Xcode vaihtaa sen tuotannoksi
        # jakelukäännöksessä (TestFlight ja App Store käyttävät molemmat
        # tuotanto-APNs:ää). Sovellus ei luota tähän arvoon vaan lukee
        # lopullisen profiilinsa — ks. PushManager.environment.
        aps-environment: development
        com.apple.developer.applesignin: [Default]
        # Lepoajastimen loppuilmoitus on merkitty aikaherkäksi
        # (RestTimer.swift). Ilman tätä oikeutta iOS pudottaa sen tavalliseksi,
        # jolloin se ei läpäise keskittymistilaa — ja salilla keskittymistila
        # on tavallinen. Vaatii saman ominaisuuden App ID:lle; automaattinen
        # allekirjoitus lisää sen yleensä itse.
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Volu/Info.plist
      properties:
        # Ei vientirajoitusten alaista salausta (vain HTTPS). Ilman tätä
        # App Store Connect kysyy saman asian jokaisen latauksen yhteydessä.
        ITSAppUsesNonExemptEncryption: false
        # Ilman tätä ActivityKit kieltäytyy käynnistämästä aktiviteettia, eikä
        # virhe näy muuna kuin siitä ettei mitään tapahdu.
        NSSupportsLiveActivities: true
        # Apple vaatii myös kirjoitustekstin, koska sovelluksella on
        # HealthKit-oikeus — vaikka Volu ei kirjoita Healthiin mitään. Ilman
        # tätä lataus App Store Connectiin hylätään (Missing purpose string).
        NSHealthUpdateUsageDescription: Kun kytket asetuksen päälle, Voluun kirjatut salitreenit tallennetaan Apple Healthiin, jotta ne näkyvät Fitness-sovelluksessa ja aktiivisuusrenkaissa.
        NSHealthShareUsageDescription: Apple Healthin tietoja luetaan, jotta askeleesi, unesi, painosi ja muissa sovelluksissa tehdyt suorituksesi näkyvät Volussa ilman käsin kirjaamista.
        NSCameraUsageDescription: Kameraa käytetään aterian kuvaamiseen, jotta AI voi arvioida ruoan ja sen makrot.
        NSPhotoLibraryUsageDescription: Kuvakirjastoa käytetään, kun valitset valmiin kuvan aterian arviointiin.
        SupabaseURL: $(VOLU_SUPABASE_URL)
        SupabaseAnonKey: $(VOLU_SUPABASE_ANON_KEY)
        APIBaseURL: $(VOLU_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Google-kirjautuminen avaa selaimen, ja paluu sovellukseen tapahtuu
        # tällä skeemalla. Ilman sitä vuo jää selaimeen eikä istuntoa synny.
        # Sama osoite on lisättävä Supabasen sallittuihin uudelleenohjauksiin.
        CFBundleURLTypes:
          - CFBundleURLName: fi.volu.app
            CFBundleURLSchemes: [fi.volu.app]

  # Widget-laajennos on olemassa vain lepoajastimen Live Activitya varten.
  # Oma bundle ID ja oma allekirjoitus: DEVELOPMENT_TEAM on naulattava tännekin,
  # samasta syystä kuin sovellukseen — xcodegen generoi projektin uudelleen.
  VoluWidgets:
    type: app-extension
    platform: iOS
    sources:
      - VoluWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.volu.app.widgets
        DEVELOPMENT_TEAM: 4498TZK9KC
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
    info:
      path: VoluWidgets/Info.plist
      properties:
        CFBundleDisplayName: Volu
        # Versionumerot asetuksista, ei plistin oletuksesta 1.0. App Store
        # hylkää latauksen jos laajennoksen versio poikkeaa sovelluksen
        # versiosta, ja ci_post_clone.sh kirjoittaa buildinumeron project.ymliin
        # — myös tähän kohteeseen, koska sed korvaa kaikki esiintymät.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
